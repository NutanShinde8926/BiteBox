<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/1e196f3ef3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/styles.css">
    <title>Cart</title>
</head>
<body>
    <header>
        <nav>
            <img src=" images/logo.png" alt="Bitebox logo">
            <ul>
                <li><a href="index.html">Home<i class="fa-solid fa-house"></i></a></li>
                <li><a href="menu.html"><i class="fa-solid fa-bars"></i>Menu</a></li>
                <li><a href="deals.html">Bite Deals</a></li>
                <li><a href="Cart.html">Cart<i class="fa-solid fa-cart-plus"></i></a></li>
                <li><a href="login.html" class="login-btn">Login<i class="fa-solid fa-arrow-right-to-bracket"></i></a>
                </li>

            </ul>
        </nav>
    </header>
     <section class="cart">

        <table>
            <thead>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Remove</th>

            </thead>
           <tbody>
            <tr>
                <td class="item">
                    <img src="https://www.shutterstock.com/shutterstock/videos/3532719707/thumb/7.jpg?ip=x480">
                    <div>
                        <h4>cheese burger</h4>
                        <p>juicey grilled burger</p>
                    </div>
                </td>
                <td>Rs199</td>
                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>
                <td>Rs199</td>
                <td><button class="remove">❌</button></td>
            </tr>

            <tr>
                <td class="item">
                    <img src="https://static.vecteezy.com/system/resources/thumbnails/074/179/140/small/a-delicious-circular-pizza-with-corn-cheese-and-green-onion-toppings-photo.jpg">
                    <div>
                        <h4>Capsicum Pizaa</h4>
                        <p>Loaded with cheese</p>
                    </div>
                </td>
                <td>Rs150</td>
                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>
                <td>Rs199</td>
                <td><button class="remove">❌</button></td>
            </tr>

            <tr>
                <td class="item">
                    <img src="https://www.shutterstock.com/shutterstock/videos/3781302409/thumb/1.jpg?ip=x480">
                    <div>
                        <h4>Alfredo pasta</h4>
                        <p>cremy white sauce</p>
                    </div>
                </td>
                <td>Rs150</td>
                <td>
                    <div class="qty-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </td>
                <td>Rs199</td>
                <td><button class="remove">❌</button></td>
            </tr>


            <tr class="grand-total">
                <td colspan="3">grand-total</td>
                <td>Rs199</td>
                <td><button>Proceed</button></td>
            </tr>
           </tbody>
        </table>
     </section>

</body>
</html>
